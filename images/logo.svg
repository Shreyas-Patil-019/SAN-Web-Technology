<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- SAN Symbol -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="url(#brandGradient)" />
    <!-- Outer concentric loop -->
    <circle cx="28" cy="28" r="18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="85 25" />
    <!-- Inner forward chevron -->
    <path d="M24 20L32 28L24 36" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Small node dot -->
    <circle cx="36" cy="28" r="2.5" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="72" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    SAN
  </text>
  <text x="73" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0284c7" letter-spacing="2.8">
    WEB TECHNOLOGY
  </text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
</svg>
